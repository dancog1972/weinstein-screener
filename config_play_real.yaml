# ============================================================
# SIMULATORE human-vs-bot su TITOLI VERI — generato da make_play_config.py
#
# I titoli qui elencati sono quelli che producono segnali Weinstein reali
# (tradeabili, gia' filtrati per liquidita'). Servono per avere una partita
# DENSA: su titoli veri presi a caso i segnali sono rarissimi e la partita
# resterebbe vuota. Umano e bot vedono gli STESSI segnali -> confronto equo.
#
# Avvio:  python play.py --config config_play_real.yaml
#         poi apri http://localhost:8000
# ============================================================
