backtest:
  start: '2001-06-01'
  end: '2024-12-31'
  oos_split: '2013-01-01'
  horizons_weeks:
  - 4
  - 13
  - 26
  - 52
stages:
  ma_weeks: 30
  slope_lookback: 4
  flat_slope: 0.005
signal:
  min_base_weeks: 12
  max_base_depth: 0.3
  require_decline: true
  max_risk_pct: null
  volume_ratio_min: 2.0
  mansfield_min: 0.0
  mansfield_rising_weeks: 4
  base_volume_max_ratio: 1.0
  base_obv_min: 0.1
  max_breakout_stretch: 0.25
  market_filter: true
  sector_filter: true
exits:
  stop_mode: pivot
  pivot_buffer: 0.02
  execution: next_open
  delisting_value: last_price
  stop_intraweek: false
  stop_buffer: 0.03
  ma_breakdown: true
  trailing_mode: ma30
  ma_trail_atr_mult: 2.0
  ma_trail_buffer: 0.05
  trailing_swing: true
  pivot_k: 2
  swing_buffer: 0.03
portfolio:
  initial_capital: 100000
  risk_per_trade: 0.01
  max_position_pct: 0.2
  max_positions: 100000
  rebalance_on_signal: false
  commission_bps: 5
  slippage_bps: 10
simulator:
  limit_weeks: 4
