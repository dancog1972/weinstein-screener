# Config del Worker Cloudflare (watchlist dei "quasi" seguiti).
# database_id lo incolli DOPO aver creato il DB con `wrangler d1 create`.
name = "weinstein-watch"
main = "worker.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"                 # nel Worker è env.DB
database_name = "weinstein-watch"
database_id = "INCOLLA_QUI_DOPO_wrangler_d1_create"
